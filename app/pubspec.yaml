name: fiscal_shield_ai
description: "FiscalShieldAI - 财智哨兵 · 地方财政风险智能预警系统"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - shaders/

  fonts:
    # 行书 — 品牌中文名
    - family: STXingkai
      fonts:
        - asset: assets/fonts/STXINGKA.TTF

    # 楷书 — 标题
    - family: STKaiti
      fonts:
        - asset: assets/fonts/STKAITI.TTF

    # 楷书备用（simkai）
    - family: SimKai
      fonts:
        - asset: assets/fonts/simkai.ttf

    # 手写花体 — 品牌英文名
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf

    # 等宽 — 数据/指标
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
