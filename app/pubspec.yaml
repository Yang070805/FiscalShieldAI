name: fiscal_shield_ai
description: "FiscalShieldAI - 财智哨兵 · 地方财政风险智能预警系统"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/
    - shaders/

  fonts:
    # 思源真黑 — 现代黑体
    - family: SourceHanSans
      fonts:
        - asset: assets/fonts/SourceHanSans-Regular.ttf
        - asset: assets/fonts/SourceHanSans-Bold.ttf
          weight: 700
    # 思源宋体 — 宋体风格
    - family: SourceHanSerif
      fonts:
        - asset: assets/fonts/SourceHanSerif-Regular.ttf
    # 得意黑 — 活泼黑体
    - family: SmileySans
      fonts:
        - asset: assets/fonts/SmileySans-Regular.ttf
    # 霞鹜文楷 — 现代楷书
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    # 小米MiSans — 小米字体
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
    # 阿里巴巴普惠体
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-Regular.ttf
    # 庞门正道标题体
    - family: PangMenBiaoDaoTi
      fonts:
        - asset: assets/fonts/PangMenBiaoDaoTi.ttf
    # 站酷高端黑
    - family: ZhanKuGaoDuanHei
      fonts:
        - asset: assets/fonts/ZhanKuGaoDuanHei.ttf

    # 行书 — 品牌中文名
    - family: STXingkai
      fonts:
        - asset: assets/fonts/STXINGKA.TTF

    # 楷书 — 标题
    - family: STKaiti
      fonts:
        - asset: assets/fonts/STKAITI.TTF

    # 楷书备用（simkai）
    - family: SimKai
      fonts:
        - asset: assets/fonts/simkai.ttf

    # 手写花体 — 品牌英文名
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf

    # 等宽 — 数据/指标
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
